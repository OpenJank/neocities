<!doctype html>
<!--Formatted with Prettier-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Favicon by https://realfavicongenerator.net/ -->
        <link
            rel="icon"
            type="image/png"
            href="/global-images/favicon.png"
            sizes="96x96"
        />
        <title>Pure Jank</title>
        <link href="/style.css" rel="stylesheet" type="text/css" media="all" />

        <style>
            @font-face {
                font-family: "FiraCode";
                src: url("/fonts/FiraCode-SemiBold.woff2") format("woff2");
            }
            @font-face {
                font-family: "JBMono";
                src: url("/fonts/JetBrainsMono-SemiBold.woff2") format("woff2");
            }
            body {
                margin: 0;
            }
            #dev-main {
                height: 100dvh;
                width: 100dvw;
                display: flex;
                align-items: center;
            }
            #over {
                width: 50%;
                margin: 0 auto;
                padding: 15px;
                background-color: rgba(0, 115, 203, 0.86);
                border-radius: 10px;
                text-align: center;
                font-size: 1em;
            }
            .device {
                font-family:
                    "liberation mono", FiraCode, JBMono, "Courier New", Courier,
                    monospace;
                width: 30%;
                display: inline-block;
                background-color: rgba(144, 0, 213, 0.61);
                color: black;
                padding: 15px 32px;
                margin: 0 5%;
                border: 5px solid black;
                border-radius: 15px;
                text-align: center;
                font-size: 1.2rem;
            }
        </style>
    </head>

    <body>
        <div id="dev-main">
            <div id="over">
                <h1>What device are you viewing on?</h1>
                <a class="device" href="/go.html">Phone</a>
                <a class="device" href="/home.html">Not Phone</a>
            </div>
        </div>
    </body>
</html>
